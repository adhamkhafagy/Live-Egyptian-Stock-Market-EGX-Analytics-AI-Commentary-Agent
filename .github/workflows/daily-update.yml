name: Daily EGX Data & Commentary

# Runs every weekday at 16:30 Cairo time (EGX closes ~14:30, so this
# gives a buffer). GitHub Actions schedules use UTC, and Cairo is UTC+2
# (or UTC+3 during Egypt's DST, if in effect) -- adjust the cron hour if
# the timing drifts after a DST change.
on:
  schedule:
    - cron: "30 14 * * 0-4"   # 14:30 UTC = 16:30 Cairo (UTC+2), Sun-Thu (EGX trading days)
  workflow_dispatch:            # lets you trigger it manually from the Actions tab too

jobs:
  fetch-and-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest EGX prices
        run: python fetch_egx_data.py

      - name: Generate AI commentary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ai_commentary.py

      - name: Commit updated data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/egx.db data/latest_commentary.txt
          git diff --staged --quiet || git commit -m "Daily EGX data update - $(date -u +'%Y-%m-%d')"
          git push
